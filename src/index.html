<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startboard</title>
  <link rel="stylesheet" href="output.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-gray-100 p-8">
  <div class="text-center mb-8">
    <h1 id="welcomeText" class="text-4xl font-bold text-gray-800 select-none">Welcome</h1>
    <div id="timeDisplay" class="text-2xl mt-4 text-gray-600 select-none hidden"></div>
  </div>

  <!-- Shortcuts Grid -->
  <div id="shortcutsContainer" class="w-full max-w-4xl hidden">
    <div id="shortcutsGrid" class="grid gap-4"></div>
  </div>

  <!-- Shortcut Prototype (hidden) -->
  <a id="shortcutPrototype" class="card bg-base-100 shadow-md hover:shadow-lg transition-shadow cursor-move p-2 flex flex-col items-center justify-center gap-1 text-center aspect-square w-24 h-24 cursor-pointer hidden">
    <img class="shortcut-icon w-6 h-6" alt="">
    <span class="shortcut-title text-xs font-medium"></span>
  </a>

  <!-- Add Shortcut Button Prototype (hidden) -->
  <button id="addShortcutPrototype" type="button" class="card bg-base-100 shadow-md hover:shadow-lg transition-shadow cursor-pointer p-2 flex flex-col items-center justify-center gap-1 text-center aspect-square w-24 h-24 hidden">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
    </svg>
  </button>

  <!-- Add Shortcut Dialog -->
  <dialog id="addShortcutDialog" class="modal">
    <div class="modal-box">
      <h3 id="dialogTitle" class="font-bold text-lg mb-4">Add Shortcut</h3>
      <form method="dialog">
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">Title</span>
          </label>
          <input type="text" id="shortcutTitle" class="input input-bordered" required />
        </div>
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">URL</span>
          </label>
          <input type="url" id="shortcutUrl" class="input input-bordered" required />
        </div>
        <div class="modal-action">
          <button type="button" id="saveShortcut" class="btn btn-primary">Save</button>
          <button type="button" id="cancelShortcut" class="btn">Cancel</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Context Menu -->
  <div id="contextMenu" class="hidden fixed bg-base-100 shadow-lg rounded-lg border border-base-300 z-50">
    <ul class="menu p-2 w-40">
      <li><button id="editShortcut" class="text-sm">Edit</button></li>
      <li><button id="deleteShortcut" class="text-sm text-error">Delete</button></li>
    </ul>
  </div>

  <!-- Open sidebar button -->
  <button id="openSidebar" class="btn btn-primary fixed bottom-4 right-4">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
    </svg>
  </button>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed top-0 right-0 h-full w-80 bg-base-100 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50">
    <div class="p-4">
      <button id="closeSidebar" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
        ✕
      </button>

      <h2 class="text-xl font-bold mt-8 mb-4">Settings</h2>

      <!-- Color Mode Section -->
      <div class="mb-6">
        <h3 class="text-sm font-semibold mb-3">Color Mode</h3>
        <div class="space-y-2">
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="colorMode" value="light" class="radio radio-primary" />
            <span class="ml-2">Light</span>
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="colorMode" value="dark" class="radio radio-primary" />
            <span class="ml-2">Dark</span>
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="colorMode" value="system" class="radio radio-primary" />
            <span class="ml-2">System</span>
          </label>
        </div>
      </div>

      <!-- Shortcuts Section -->
      <div class="mb-6">
        <h3 class="text-sm font-semibold mb-3">Shortcuts</h3>
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" id="shortcutsToggle" class="toggle toggle-primary" />
          <span class="ml-3">Show shortcuts</span>
        </label>
      </div>

      <div id="settingsContainer"></div>
    </div>
  </div>


  <!-- Overlay (transparent, for click-to-close) -->
  <div id="overlay" class="fixed inset-0 hidden z-40"></div>

  <script src="config.js"></script>
  <script src="widgets/StartWidget.js"></script>
  <script src="widgets/WelcomeTextWidget.js"></script>
  <script src="widgets/TimeWidget.js"></script>
  <script src="shortcuts.js"></script>
  <script src="app.js"></script>
</body>
</html>
