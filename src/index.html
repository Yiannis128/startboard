<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startboard</title>
  <link rel="icon" type="image/png" href="img/icon.png">
  <link rel="stylesheet" href="output.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-base-200 p-8">
  <div class="text-center mb-4 max-w-4xl w-full">
    <h1 id="welcomeText" class="text-4xl font-bold text-base-content select-none break-words" style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), -1px -1px 0 rgba(0, 0, 0, 0.3), 1px -1px 0 rgba(0, 0, 0, 0.3), -1px 1px 0 rgba(0, 0, 0, 0.3), 1px 1px 0 rgba(0, 0, 0, 0.3);">Welcome</h1>
  </div>

  <div class="text-center mb-8">
    <div id="timeDisplay" class="text-2xl text-base-content opacity-70 select-none hidden"></div>
  </div>

  <!-- Shortcuts Grid -->
  <div id="shortcutsContainer" class="w-full max-w-4xl hidden">
    <div id="shortcutsGrid" class="grid gap-4"></div>
  </div>

  <!-- Shortcut Prototype (hidden) -->
  <a id="shortcutPrototype" class="card bg-base-100 shadow-md hover:shadow-lg transition-shadow cursor-move p-2 flex flex-col items-center justify-center gap-1 text-center aspect-square w-24 h-24 cursor-pointer hidden">
    <img class="shortcut-icon w-6 h-6" alt="">
    <span class="shortcut-title text-xs font-medium"></span>
  </a>

  <!-- Add Shortcut Button Prototype (hidden) -->
  <button id="addShortcutPrototype" type="button" class="card bg-base-100 shadow-md hover:shadow-lg transition-shadow cursor-pointer p-2 flex flex-col items-center justify-center gap-1 text-center aspect-square w-24 h-24 hidden">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
    </svg>
  </button>

  <!-- Add Shortcut Dialog -->
  <dialog id="addShortcutDialog" class="modal">
    <div class="modal-box">
      <h3 id="dialogTitle" class="font-bold text-lg mb-4">Add Shortcut</h3>
      <form method="dialog">
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">Title</span>
          </label>
          <input type="text" id="shortcutTitle" class="input input-bordered" required />
        </div>
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">URL</span>
          </label>
          <input type="url" id="shortcutUrl" class="input input-bordered" required />
        </div>
        <div class="modal-action">
          <button type="button" id="saveShortcut" class="btn btn-primary">Save</button>
          <button type="button" id="cancelShortcut" class="btn">Cancel</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Donate button -->
  <a href="https://github.com/sponsors/Yiannis128" class="btn btn-accent fixed bottom-4 right-20">
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </a>

  <!-- Open sidebar button -->
  <button id="openSidebar" class="btn btn-primary fixed bottom-4 right-4">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
    </svg>
  </button>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed top-0 right-0 h-full w-80 bg-base-100 transform translate-x-full transition-transform duration-300 ease-in-out z-50 overflow-y-auto">
    <div class="sticky top-0 bg-base-100 z-10 p-4 flex items-center justify-between border-b border-base-300">
      <h2 class="text-xl font-bold">Settings</h2>
      <button id="closeSidebar" class="btn btn-sm btn-circle btn-ghost">
        ✕
      </button>
    </div>
    <div class="p-4">

      <!-- Color Mode Section -->
      <div class="mb-6">
        <h3 class="text-sm font-semibold mb-3">Color Mode</h3>
        <div class="space-y-2">
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="colorMode" value="light" class="radio radio-primary" />
            <span class="ml-2">Light</span>
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="colorMode" value="dark" class="radio radio-primary" />
            <span class="ml-2">Dark</span>
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="colorMode" value="system" class="radio radio-primary" />
            <span class="ml-2">System</span>
          </label>
        </div>

        <!-- Theme colors container -->
        <div id="themeColorsContainer" class="mt-4"></div>
      </div>

      <div id="settingsContainer"></div>

      <!-- Export/Import Section -->
      <div class="mb-6 mt-8 pt-6 border-t border-base-300">
        <h3 class="text-sm font-semibold mb-3">Configuration</h3>
        <div class="space-y-2">
          <button id="exportConfig" class="btn btn-outline btn-primary w-full">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Export Settings
          </button>
          <label class="btn btn-outline btn-secondary w-full">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            Import Settings
            <input type="file" id="importConfig" accept=".json" class="hidden" />
          </label>
        </div>
      </div>

      <!-- Additional Buttons -->
      <div class="mb-6 space-y-2">
        <a href="https://github.com/sponsors/Yiannis128" class="btn btn-ghost w-full">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          Donate via GitHub Sponsors
        </a>
        <a href="https://github.com/Yiannis128/startboard" class="btn btn-ghost w-full">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          View on GitHub
        </a>
        <button id="additionalSettings" class="btn btn-ghost w-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
          </svg>
          Additional Settings
        </button>
      </div>

      <!-- Version -->
      <div class="text-center text-xs opacity-50 pb-4">
        <span id="versionDisplay"></span>
      </div>
    </div>
  </div>

  <!-- Overlay (transparent, for click-to-close) -->
  <div id="overlay" class="fixed inset-0 hidden z-40"></div>

  <!-- Context Menu -->
  <div id="contextMenu" class="hidden fixed bg-base-100 shadow-lg rounded-lg border border-base-300 z-50">
    <ul class="menu p-2 w-40">
      <li><button id="editShortcut" class="text-sm">Edit</button></li>
      <li><button id="deleteShortcut" class="text-sm text-error">Delete</button></li>
    </ul>
  </div>

  <script src="config.js"></script>
  <script src="widgets/StartWidget.js"></script>
  <script src="widgets/WelcomeTextWidget.js"></script>
  <script src="widgets/TimeWidget.js"></script>
  <script src="widgets/ShortcutsWidget.js"></script>
  <script src="widgets/ThemeWidget.js"></script>
  <script src="widgets/BackdropWidget.js"></script>
  <script src="app.js"></script>
</body>
</html>
