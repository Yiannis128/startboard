<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startboard Settings</title>
  <link rel="stylesheet" href="output.css">
</head>
<body class="bg-base-100 min-h-screen">
  <div class="p-4">
    <h2 class="text-xl font-bold mb-4">Settings</h2>

    <!-- Color Mode Section -->
    <div class="mb-6">
      <h3 class="text-sm font-semibold mb-3">Color Mode</h3>
      <div class="space-y-2">
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="colorMode" value="light" class="radio radio-primary" />
          <span class="ml-2">Light</span>
        </label>
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="colorMode" value="dark" class="radio radio-primary" />
          <span class="ml-2">Dark</span>
        </label>
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="colorMode" value="system" class="radio radio-primary" />
          <span class="ml-2">System</span>
        </label>
      </div>
    </div>

    <!-- Dynamic widget settings will be inserted here -->
    <div id="settingsContainer"></div>

    <!-- Additional Settings Section -->
    <div class="mb-6 mt-8">
      <h3 class="text-sm font-semibold mb-3">Additional Settings</h3>
      <button id="chromeAppearanceBtn" class="btn btn-ghost btn-sm">
        Chrome Appearance Settings
      </button>
    </div>

    <!-- Donate Section -->
    <div class="mb-6">
      <h3 class="text-sm font-semibold mb-3">Donate</h3>
      <a href="https://github.com/sponsors/Yiannis128" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm">
        GitHub Sponsors
      </a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="widgets/StartWidget.js"></script>
  <script src="widgets/WelcomeTextWidget.js"></script>
  <script src="widgets/TimeWidget.js"></script>
  <script src="widgets/ShortcutsWidget.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
