name: Build

on:
  push:
    branches:
      - master
  pull_request:
  # Callable so the release builds and tests exactly what CI does.
  workflow_call:
    inputs:
      release-notes:
        description: The release body to ship as the What's New page.
        type: string
        required: false
      release-tag:
        description: The tag those notes belong to, stamped into the page.
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On the job, not the workflow: a superseded build is worth cancelling, but
    # the deploy job below must not be killed part-way through going live.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # For the Pages upload, which only runs on a master push.
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: ./.github/actions/setup

      # The What's New page ships the notes of the release the build belongs to:
      # its own for a release, the latest published one for master, so what Pages
      # deploys is not the development placeholder. A pull request keeps that
      # placeholder, which is what it is there to show.
      - name: Write the release notes into the build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.release-notes }}
          TAG: ${{ inputs.release-tag }}
        run: |
          # The path WhatsNewWidget fetches. Nothing else ties the two together,
          # and a stray file here would ship the placeholder to everyone.
          [ -f src/whats-new.md ] || {
            echo "::error::src/whats-new.md is gone - update this step to match the widget."
            exit 1
          }
          if [ -z "$NOTES" ]; then
            NOTES=$(gh release view --json body --jq .body 2>/dev/null) || NOTES=''
            TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null) || TAG=''
          fi
          if [ -n "$NOTES" ]; then
            # The stamp is what the widget tracks as read, so notes that outlive
            # a version bump do not mark the next release's notes read with it.
            {
              if [ -n "$TAG" ]; then printf '<!-- release: %s -->\n\n' "$TAG"; fi
              printf '%s\n' "$NOTES"
            } > src/whats-new.md
            echo "Shipping the notes for ${TAG:-an unnamed release}."
          else
            echo "::warning::No release notes found - shipping the placeholder."
          fi

      # Both targets, so a PR cannot break the extension build without failing.
      - name: Build extension and PWA
        run: bun run build:all

      # The suite needs the built dist/pwa/sw.js, which the step above produced.
      - name: Run tests
        run: bun run test:only

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/startboard-extension.zip
          if-no-files-found: error
          retention-days: 7
          # Already a zip of compressed images; recompressing buys nothing.
          compression-level: 0

      - name: Set up Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload the PWA for Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/pwa

  # Master only, and after the suite: Pages gets the build the tests passed,
  # rather than a second build racing alongside them.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Superseded builds are worth cancelling; a live deployment is not.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
