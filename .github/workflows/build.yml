name: Build

on:
  push:
    branches:
      - master
  # Callable so the release builds and tests exactly what CI does.
  workflow_call:
    outputs:
      version:
        description: The release version
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Build extension and PWA
        run: bun run build:all

      # The suite needs the built dist/pwa/sw.js, which the step above produced.
      - name: Run tests
        run: bun run test:only

      - name: Read version
        id: version
        run: echo "version=$(bun scripts/version.js)" >> "$GITHUB_OUTPUT"

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/startboard-extension.zip
          if-no-files-found: error
