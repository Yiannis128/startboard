name: Release

on:
  release:
    types: [created]

# Publishing to the Chrome Web Store needs four repository secrets:
#
#   CHROME_EXTENSION_ID    the item id from the Web Store dashboard URL
#   CHROME_CLIENT_ID       OAuth client id  (Google Cloud console)
#   CHROME_CLIENT_SECRET   OAuth client secret
#   CHROME_REFRESH_TOKEN   refresh token for that client
#
# See https://developer.chrome.com/docs/webstore/using-api. Without them the
# publish job fails loudly rather than reporting a release that never shipped.

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the build to the release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download extension
        uses: actions/download-artifact@v8
        with:
          name: extension

      # A release tagged v0.2.0 built from a manifest still saying 0.1.1 would
      # publish a mislabelled extension, so refuse rather than guess.
      - name: Check the tag matches manifest.json
        env:
          BUILT: ${{ needs.build.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${TAG#v}" != "$BUILT" ]; then
            echo "::error::Release tag $TAG does not match manifest.json version $BUILT."
            echo "::error::Bump \"version\" in manifest.json and package.json, then re-tag."
            exit 1
          fi
          echo "Publishing version $BUILT"

      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" startboard-extension.zip --clobber

      - name: Publish to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for name in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret CHROME_$name is not set; cannot publish to the Web Store."
              exit 1
            fi
          done

          token=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Could not exchange the refresh token for an access token."
            exit 1
          fi

          # The upload and publish endpoints answer 200 with a failure payload,
          # so the response body decides the outcome, not the status code.
          upload=$(curl -sS -X PUT \
            -H "Authorization: Bearer $token" \
            -H "x-goog-api-version: 2" \
            -T startboard-extension.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "Upload response: $upload"
          if [ "$(echo "$upload" | jq -r '.uploadState // empty')" != "SUCCESS" ]; then
            echo "::error::Web Store upload failed."
            exit 1
          fi

          publish=$(curl -sS -X POST \
            -H "Authorization: Bearer $token" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          echo "Publish response: $publish"
          if echo "$publish" | jq -e '.error // empty' >/dev/null; then
            echo "::error::Web Store publish failed."
            exit 1
          fi

          echo "Published. Google review can take several days before it goes live."
