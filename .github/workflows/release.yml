name: Release

on:
  release:
    types: [created]

# Publishing needs four repository secrets: CHROME_EXTENSION_ID,
# CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN.
# See scripts/publish-webstore.sh.

permissions:
  contents: read

jobs:
  # A release tagged v0.2.0 built from a manifest still saying 0.1.1 would
  # publish a mislabelled extension, so refuse rather than guess. Runs beside
  # the build, not after it, so the mistake costs seconds instead of a full run.
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node ships on the runner and scripts/version.js needs no dependencies,
      # so this skips Bun and the install entirely.
      - name: Check the tag matches the manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BUILT=$(node scripts/version.js)
          if [ "${TAG#v}" != "$BUILT" ]; then
            echo "::error::Release tag $TAG does not match version $BUILT."
            echo "::error::Bump manifest.json and package.json together, then re-tag."
            exit 1
          fi
          echo "Publishing version $BUILT"

      # The body becomes the What's New page, so an empty one ships the
      # development placeholder to everyone who installs this.
      - name: Check the release has notes
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::This release has no description to show as What's New."
            exit 1
          fi

  # Builds and tests, so a release cannot ship code the suite rejects.
  build:
    uses: ./.github/workflows/build.yml
    with:
      release-notes: ${{ github.event.release.body }}
      release-tag: ${{ github.event.release.tag_name }}

  publish:
    needs: [build, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to attach the build to the release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download extension
        uses: actions/download-artifact@v8
        with:
          name: extension

      # Before the Web Store, so a publish failure still leaves a usable build.
      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" startboard-extension.zip --clobber

      - name: Publish to the Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: ./scripts/publish-webstore.sh startboard-extension.zip
