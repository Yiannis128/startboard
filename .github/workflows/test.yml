name: Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Both targets, so a PR cannot break the extension build without failing.
      - name: Build
        run: bun run build:all

      # The service worker suite reads dist/pwa/sw.js, which the build above
      # produced, so this does not rebuild.
      - name: Run tests
        run: bun run test:only
