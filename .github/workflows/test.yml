name: Test

# Master is covered by build.yml, which runs the same suite before publishing
# artifacts; running it here too would build the same commit twice.
on: pull_request

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: ./.github/actions/setup

      # Both targets, so a PR cannot break the extension build without failing.
      - name: Build
        run: bun run build:all

      - name: Run tests
        run: bun run test:only
