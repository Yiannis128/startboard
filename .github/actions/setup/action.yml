name: Set up Bun
description: Installs Bun and restores dependencies from the lockfile.

# Checkout stays in the caller: a local action cannot be resolved until the
# repository is already on disk.
runs:
  using: composite
  steps:
    # From packageManager in package.json, so CI and local agree and the
    # binary cache keys on a fixed version instead of resolving "latest".
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # setup-bun caches only the Bun binary, so without this every job
    # re-downloads every dependency.
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash
